<section><h2>隱私權政策</h2><p>Ongle iOS App 不會收集文件或個人資料，也不會傳輸至開發者伺服器。不使用帳號、分析或追蹤 SDK。最近檔案、閱讀位置、設定與轉換結果儲存在裝置上。您可在 App 設定中清除紀錄與快取。系統備份及 iCloud 檔案依您的 Apple 設定與檔案供應商政策處理。分享、複製及外部連結由您主動操作，並適用接收服務的政策。支援郵件的寄件地址與內容僅用於回覆，不再需要時即刪除。資料處理方式變更時，我們將更新本政策及商店聲明。</p><p><a href="mailto:h1.soft.x001@gmail.com">h1.soft.x001@gmail.com</a></p></section></main>
