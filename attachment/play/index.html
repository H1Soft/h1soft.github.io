  <style>
    @font-face{font-family:BootstrapSans;src:url('assets/assets/fonts/BootstrapSans.ttf') format('truetype');font-display:swap;font-weight:100 900}
    @font-face{font-family:BootstrapDisplay;src:url('assets/assets/fonts/BootstrapDisplay.ttf') format('truetype');font-display:swap}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:#FFF9F1;color:#2E2430}
    body{font-family:BootstrapSans,system-ui,sans-serif}
    ::selection{background:#FFD7E2;color:#2E2430}
    #loading{min-height:100dvh;display:grid;place-items:center;padding:32px 24px;text-align:center}
    .boot-content{width:100%;max-width:352px}
    .boot-plush{display:block;width:156px;height:234px;object-fit:contain;margin:0 auto 18px}

    html[lang=en] #boot-title{font-size:32px}
    #boot-status{font-size:15px;line-height:1.7;margin:0;text-wrap:balance}
    #boot-help{font-size:13px;line-height:1.7;color:#5E505A;margin:8px 0 0;text-wrap:balance}

    #boot-retry:focus-visible{outline:3px solid #A3264B;outline-offset:4px}
    #boot-retry[hidden]{display:none}
    noscript p{font-size:14px;line-height:1.7}

  </style>
<script defer src="/js/analytics.js?v=services-20260930"></script>

<body>
  <main id="loading" aria-labelledby="boot-title">
    <div class="boot-content">
      <img class="boot-plush" src="assets/assets/dist/plush_p01_secure_puppy_384.webp" alt="" width="156" height="234" fetchpriority="high">
      <h1 id="boot-title">애착인형 뽑기</h1>
      <p id="boot-status" role="status" aria-live="polite" aria-atomic="true">인형방을 여는 데 필요한 파일을 받고 있어요.</p>
      <p id="boot-help">처음에는 조금 더 걸릴 수 있어요.</p>
      <div class="boot-controls"><button id="boot-retry" type="button" hidden>다시 시도</button></div>
      <noscript><p>테스트를 시작하려면 브라우저에서 JavaScript를 켜 주세요.</p></noscript>
    </div>
  </main>
  <script>
    (() => {
      // SharedPreferencesAsyncWeb stores this exact key as a JSON string.
      // Read only the language preference; never touch results or share payloads.
      let savedLanguage;
      try { savedLanguage = JSON.parse(localStorage.getItem('aechak.v1.language')); } catch (_) {}
      let hintedLanguage;
      try {
        const route = location.hash.startsWith('#/') ? new URL(location.hash.slice(1), location.origin) : new URL(location.href);
        hintedLanguage = route.searchParams.get('lang');
      } catch (_) {}
      const supported = new Set(['de','en','es','fa','fr','id','it','nl','pl','pt','ru','tr','vi','zh','ko','ja']);
      const canonical = value => {
        if (typeof value !== 'string') return null;
        const base = value.trim().toLowerCase().replaceAll('-', '_').split('_')[0];
        return base === 'in' ? 'id' : supported.has(base) ? base : null;
      };
      const device = (navigator.languages || [navigator.language]).map(canonical).find(Boolean);
      const language = canonical(savedLanguage) || canonical(hintedLanguage) || device || 'en';
      const korean = language === 'ko';
      const copy = korean ? {
        title:'애착인형 뽑기', download:'인형방을 여는 데 필요한 파일을 받고 있어요.',
        engine:'인형방을 열고 있어요.', content:'인형들의 이야기를 불러오고 있어요.',
        help:'처음에는 조금 더 걸릴 수 있어요.',
        slow:'조금 오래 걸리고 있어요. 연결을 확인한 뒤 다시 시도할 수 있어요.',
        error:'인형방을 열지 못했어요.', recovery:'연결을 확인한 뒤 다시 시도해 주세요.', retry:'다시 시도',
      } : {
        title:'Aechak Plush', download:'Getting the files for your plush room.',
        engine:'Opening the plush room.', content:'Loading the plush stories.',
        help:'Your first visit may take a little longer.',
        slow:'This is taking a little longer. Check your connection or try again.',
        error:'We couldn’t open the plush room.', recovery:'Check your connection, then try again.', retry:'Try again',
      };
      document.documentElement.lang = korean ? 'ko' : 'en';
      const status = document.getElementById('boot-status');
      const help = document.getElementById('boot-help');
      const retry = document.getElementById('boot-retry');
      document.getElementById('boot-title').textContent = copy.title;
      status.textContent = copy.download;
      help.textContent = copy.help;
      retry.textContent = copy.retry;
      // Reload preserves the original path, query and hash for shared results.
      retry.addEventListener('click', () => location.reload());
      let active = true, failed = false;
      const timer = setTimeout(() => {
        if (!active || failed) return;
        help.textContent = copy.slow;
        retry.hidden = false;
      }, 15000);
      window.aechakBoot = {
        stage(name) { if (active && !failed && copy[name]) status.textContent = copy[name]; },
        fail() {
          if (!active) return;
          failed = true;
          clearTimeout(timer);
          status.textContent = copy.error;
          help.textContent = copy.recovery;
          retry.hidden = false;
        },
      };
      window.addEventListener('flutter-first-frame', () => {
        active = false;
        clearTimeout(timer);
        document.getElementById('loading')?.remove();
      }, {once:true});
    })();
  </script>
  <script src="flutter_bootstrap.e7e58da134026cad.js" async onerror="window.aechakBoot.fail()"></script>
</body>
</html>
