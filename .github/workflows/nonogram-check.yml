name: Validate Nonogram website
on:
  push:
    paths:
      - '_source/nonogram/**'
      - '.github/workflows/nonogram-check.yml'
  pull_request:
    paths:
      - '_source/nonogram/**'
      - '.github/workflows/nonogram-check.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: _source/nonogram
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: _source/nonogram/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
        env:
          ASTRO_TELEMETRY_DISABLED: '1'
      - run: npm run test:build
