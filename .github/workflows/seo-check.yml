name: Public site SEO

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r tools/seo/requirements.txt
      - run: python tools/seo/check.py
      - run: python tools/seo/favicons.py --check
      - run: python tools/seo/product_links.py --check
      - run: python tools/seo/check_product_links.py
      - run: node tools/localize-store-links.mjs --check
