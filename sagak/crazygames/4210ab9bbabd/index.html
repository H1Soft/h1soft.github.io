<style>
  :root { --paper:#FFFCF0; --ink:#100F0F; --sub:#6F6E69; --faint:#9F9D96; --track:#E4E2D8; --pencil:#403E3C; }
  @media (prefers-color-scheme: dark) {
    :root { --paper:#100F0F; --ink:#CECDC3; --sub:#878580; --faint:#6F6E69; --track:#282726; --pencil:#B7B5AC; }
  }
  html, body { margin:0; height:100%; background:var(--paper); color:var(--ink); overflow:hidden; overscroll-behavior:none; touch-action:none;
    font-family:'Pretendard','Apple SD Gothic Neo',system-ui,sans-serif; -webkit-font-smoothing:antialiased; }
  #sagak { position:fixed; inset:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px); }
  /* W01: the same mark, name and place as the app's own splash, so the hand-over moves nothing. */
  .page { position:fixed; inset:0; height:100dvh; display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:var(--paper); z-index:10; transition:opacity 320ms cubic-bezier(.22,1,.36,1); }
  .page.gone { opacity:0; pointer-events:none; }
  .mark { width:92px; height:92px; border-radius:22%; display:block; }
  .name { font-family:Fraunces,Georgia,serif; font-weight:600; font-size:25px; margin-top:16px; line-height:1.3; }
  .post { font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:.16em; font-weight:500; color:var(--faint); margin-top:4px; }
  .rule { position:relative; width:120px; height:2px; margin-top:30px; background:var(--track); }
  .fill { position:absolute; left:0; top:0; bottom:0; width:0; background:var(--ink); transition:width 400ms ease-out; }
  .lead { position:absolute; top:-9px; left:0; width:22px; height:5px; border:1.3px solid var(--pencil); border-radius:1px; box-sizing:border-box;
    transform:rotate(-24deg); transform-origin:left center; transition:left 400ms ease-out; }
  .slow { position:absolute; left:24px; right:24px; bottom:calc(46px + env(safe-area-inset-bottom)); text-align:center; font-size:13px; color:var(--sub);
    opacity:0; transition:opacity 400ms; }
  .slow.on { opacity:1; }
  @media (min-width: 600px) {
    .mark { width:150px; height:150px; }
    .name { font-size:44px; margin-top:40px; }
    .post { font-size:12px; margin-top:12px; }
  }
  /* W02 */
  #nope { display:none; padding:0 32px; text-align:center; }
  #nope.on { display:flex; }
  #nope img { width:140px; height:140px; opacity:.85; }
  @media (prefers-color-scheme: dark) { #nope img { filter:invert(1); } }
  #nope h2 { font-family:Fraunces,'Pretendard',serif; font-weight:600; font-size:24px; margin:12px 0 0; }
  #nope p { color:var(--sub); font-size:15px; line-height:1.6; max-width:440px; margin:8px 0 0; }
  #nope .stores { display:flex; gap:12px; margin-top:26px; flex-wrap:wrap; justify-content:center; }
  #nope a { display:inline-flex; align-items:center; height:44px; padding:0 16px; border-radius:8px; border:1px solid var(--ink); color:var(--ink);
    font-size:14px; font-weight:600; text-decoration:none; }
  #nope small { font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--faint); margin-top:22px; }
  @media (prefers-reduced-motion: reduce) { .page, .fill, .lead, .slow { transition:none; } }
  /* The canvas carries no text: this describes the page to screen readers and search engines. */
  .about { position:absolute; width:1px; height:1px; margin:-1px; padding:0; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0; }
</style>
<noscript><style>
  html, body { overflow:auto; touch-action:auto; height:auto; }
  #boot { display:none; }
  .about { position:static; width:auto; height:auto; margin:0 auto; padding:48px 24px; max-width:640px; overflow:visible; clip:auto; white-space:normal; line-height:1.7; }
  .about a { color:var(--ink); }
</style></noscript>

<body>
<div id="sagak"></div>




<div id="boot" class="page" role="status" aria-live="polite">
  <img class="mark" src="icons/boot-mark.png" alt="">
  <div class="name" id="bootName">사각사각</div>
  <div class="post">SAGAK POST</div>
  <div class="rule" aria-hidden="true"><span class="fill" id="bootFill"></span><span class="lead" id="bootLead"></span></div>
  <div class="slow" id="bootSlow">종이를 펴는 중이에요 · 처음 한 번만 오래 걸려요</div>
</div>

<div id="nope" class="page" style="z-index:11">
  <img src="icons/plane.png" alt="">
  <h2 id="nopeTitle">이 브라우저에서는 열 수 없어요</h2>
  <p id="nopeBody">사각사각 웹판은 최신 브라우저에서 돌아가요. 브라우저를 업데이트하거나 앱으로 받아 주세요.</p>
  
  <small>Chrome 119 · Edge 119 · Firefox 120 · Safari 18.2</small>
</div>

<script>
(function () {
  // ---- language for the two HTML pages -------------------------------------------------
  var lang = 'en';
  try { var p = JSON.parse(window.h1Distribution.storage.getItem('sagak:profile.json') || '{}'); lang = (p.settings && p.settings.language) || ''; } catch (e) {}
  lang = (lang || navigator.language || 'en').slice(0, 2);
  var all = {
    ko: ['사각사각', '종이를 펴는 중이에요 · 처음 한 번만 오래 걸려요', '이 브라우저에서는 열 수 없어요', '사각사각 웹판은 최신 브라우저에서 돌아가요. 브라우저를 업데이트하거나 앱으로 받아 주세요.'],
    ja: ['サガク', '紙を広げています · 初回だけ時間がかかります', 'このブラウザでは開けません', 'ブラウザを更新するか、アプリをご利用ください。'],
    en: ['Sagak', 'Unfolding the paper · only the first visit takes this long', 'This browser can’t open Sagak', 'Sagak on the web needs a current browser. Please update it, or get the app.']
  };
  var text = all[lang] || all.en;
  document.documentElement.lang = lang;
  document.getElementById('bootName').textContent = text[0];
  document.getElementById('bootSlow').textContent = text[1];
  document.getElementById('nopeTitle').textContent = text[2];
  document.getElementById('nopeBody').textContent = text[3];

  // ---- W01: a pencil rule that follows real progress, never a number ----------------------
  var fill = document.getElementById('bootFill'), lead = document.getElementById('bootLead');
  var shown = 0, done = false;
  function progress(f) { shown = Math.max(shown, Math.min(f, 1)); fill.style.width = (shown * 100) + '%'; lead.style.left = (shown * 100) + '%'; }
  var start = Date.now();
  var creep = setInterval(function () { if (!done) progress(Math.min(0.92, shown + (0.92 - shown) * 0.06)); }, 120);
  setTimeout(function () { if (!done) document.getElementById('bootSlow').classList.add('on'); }, 4000);

  // ---- W02: anything that stops WebAssembly before the app draws ---------------------------
  function unsupported() {
    if (done) return;
    done = true; clearInterval(creep);
    document.getElementById('boot').classList.add('gone');
    document.getElementById('nope').classList.add('on');
  }
  if (typeof WebAssembly !== 'object') unsupported();
  window.addEventListener('error', function (e) { if (/WebAssembly|wasm|CompileError/i.test(String(e.message || e.error))) unsupported(); });
  window.addEventListener('unhandledrejection', function (e) { if (/WebAssembly|wasm|CompileError/i.test(String(e.reason))) unsupported(); });

  // ---- audio: the app's synthesised voices, decoded once each ------------------------------
  var masterGain = null, activeVoices = new Set();
  var ctx = null, buffers = {}, musicWanted = false, musicLevel = 0.4, musicNode = null, musicGain = null;
  function context() {
    if (!ctx) { var C = window.AudioContext || window.webkitAudioContext; if (!C) return null; ctx = new C(); masterGain = ctx.createGain(); masterGain.gain.value = window.h1Distribution.audioMuted ? 0 : 1; masterGain.connect(ctx.destination); }
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  }
  // Browsers start audio only after a gesture; the first touch or key opens it.
  ['pointerdown', 'keydown', 'touchend'].forEach(function (t) {
    window.addEventListener(t, function () { if (context() && musicWanted) startMusic(); }, { passive: true });
  });
  function bytes(b64) { var s = atob(b64), u = new Uint8Array(s.length); for (var i = 0; i < s.length; i++) u[i] = s.charCodeAt(i); return u; }
  function startMusic() {
    var c = context(), b = buffers.music;
    if (!c || !b || musicNode) return;
    musicGain = c.createGain(); musicGain.gain.value = musicLevel; musicGain.connect(masterGain);
    musicNode = c.createBufferSource(); musicNode.buffer = b; musicNode.loop = true; musicNode.connect(musicGain); musicNode.start();
  }
  function stopMusic() { if (musicNode) { try { musicNode.stop(); } catch (e) {} musicNode = null; } }

  window.sagak = {
    progress: progress,
    bootDone: function () {
      if (done) return;
      done = true; clearInterval(creep); progress(1);
      setTimeout(function () { var b = document.getElementById('boot'); b.classList.add('gone'); setTimeout(function () { b.remove(); }, 400); }, 120);
    },
    audioLoad: function (key, wav) {
      var c = context(); if (!c || buffers[key]) return;
      c.decodeAudioData(bytes(wav).buffer).then(function (b) { buffers[key] = b; if (key === 'music' && musicWanted) startMusic(); }, function () {});
    },
    audioPlay: function (key, gain, rate) {
      var c = context(), b = buffers[key]; if (!c || !b) return;
      var s = c.createBufferSource(), g = c.createGain();
      s.buffer = b; s.playbackRate.value = rate; g.gain.value = gain; s.connect(g); g.connect(masterGain); activeVoices.add(s); s.onended = function(){ activeVoices.delete(s); s.disconnect(); g.disconnect(); }; s.start();
    },
    audioStop: function () { activeVoices.forEach(function(s){ try { s.stop(); } catch(e) {} }); activeVoices.clear(); stopMusic(); },
    platformMute: function (muted) { if(masterGain) masterGain.gain.value = muted ? 0 : 1; },
    hasMusic: function () { return !!buffers.music; },
    music: function (on, level) {
      musicWanted = on; if (level > 0) musicLevel = level;
      if (on) { startMusic(); if (musicGain) musicGain.gain.value = musicLevel; } else stopMusic();
    },
    shareText: function (t) {
      if (navigator.share) { navigator.share({ text: t }).catch(function () {}); return; }
      if (navigator.clipboard) navigator.clipboard.writeText(t).catch(function () {});
    },
    sharePng: function (b64) {
      var blob = new Blob([bytes(b64)], { type: 'image/png' });
      var file = (typeof File === 'function') ? new File([blob], 'SAGAK.png', { type: 'image/png' }) : null;
      if (file && navigator.canShare && navigator.canShare({ files: [file] })) { navigator.share({ files: [file] }).catch(function () {}); return; }
      var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'SAGAK.png'; document.body.appendChild(a); a.click();
      setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
    }
  };
})();
</script>
<script src="h1-start.js"></script>
</body>
