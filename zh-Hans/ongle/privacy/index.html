<section><h2>隐私政策</h2><p>Ongle iOS 应用不会收集文档或个人数据，也不会将其传输到开发者服务器。不使用账户、分析或跟踪 SDK。最近文件、阅读位置、设置和转换结果保存在设备上。可在应用设置中清除历史记录和缓存。系统备份和 iCloud 文件遵循您的 Apple 设置及文件提供商政策。共享、复制和外部链接由您主动操作，并遵循接收服务的政策。支持邮件的发件地址和内容仅用于回复，不再需要时会删除。数据处理方式变更时，我们将更新此政策和商店声明。</p><p><a href="mailto:h1.soft.x001@gmail.com">h1.soft.x001@gmail.com</a></p></section></main>
